<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kiểm tra chuyển dữ liệu</title><style>body{font:16px system-ui;margin:48px auto;padding:20px;max-width:760px;color:#1d3562}button{background:#1d3562;color:white;border:0;border-radius:8px;padding:14px 20px;font:inherit}pre{white-space:pre-wrap}</style><h1>Kiểm tra chuyển dữ liệu</h1><p>Chỉ Manager. Thao tác kiểm tra sử dụng file thử trên nhánh riêng.</p><button id="check">Kiểm tra kho Neon</button><pre id="result" role="status"></pre><hr><label>Mã bản sao nguồn <input id="backupId" size="42" autocomplete="off"></label><p><button id="clone">Sao chép sang nhánh kiểm thử</button></p><pre id="cloneResult" role="status"></pre><script>document.getElementById('check').onclick=async()=>{const b=document.getElementById('check'),out=document.getElementById('result');b.disabled=true;out.textContent='Đang kiểm tra…';try{const r=await fetch('/api/staff/admin/neon-storage-check',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});const data=await r.json();out.textContent=JSON.stringify(data,null,2);}catch(e){out.textContent=e.message;}finally{b.disabled=false;}};document.getElementById('clone').onclick=async()=>{
 const button=document.getElementById('clone'),out=document.getElementById('cloneResult'),id=document.getElementById('backupId').value.trim();button.disabled=true;
 const api=async(path)=>{const r=await fetch('/api/staff/admin/neon-stage/'+id+path,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}),data=await r.json();if(!r.ok)throw Error(data.error||'Chưa thực hiện được thao tác');return data;};
 try{let job=await api('/start');while(job.stage!=='complete'){out.textContent=JSON.stringify(job,null,2);job=await api('');}out.textContent=JSON.stringify(job,null,2);}catch(e){out.textContent='Chưa hoàn tất: '+e.message;}finally{button.disabled=false;}
};</script></html>
